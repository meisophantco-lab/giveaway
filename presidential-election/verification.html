<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Required</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .verification-card{
            width:90%;
            max-width:500px;
            background:#fff;
            margin:-60px auto 50px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
            text-align:center;
        }

        .verification-card h1{
            color:#008751;
            margin-bottom:15px;
        }

        .verification-card p{
            color:#555;
            line-height:1.7;
            margin-bottom:15px;
        }

        .share-btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#008751;
            color:#fff;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
            margin-top:15px;
        }

        .share-btn:hover{
            background:#006c40;
        }

        .share-options{
            display:none;
            margin-top:20px;
        }

        .app-btn{
            display:block;
            width:100%;
            text-decoration:none;
            padding:14px;
            margin:10px 0;
            background:#f4f6f8;
            border-radius:10px;
            color:#333;
            font-weight:600;
            border:1px solid #ddd;
        }
    </style>
</head>
<body>

<header class="banner"></header>

<div class="title-section">
    <h1>Verification Required</h1>
    <p>Complete the next step below.</p>
</div>

<div class="verification-card">

    <h1>GOOD NEWS!</h1>

    <p>
        Your application has been received successfully.
    </p>

    <p>
        Share this opportunity with friends and family using any of the options below.
    </p>

    <button class="share-btn" onclick="showShareOptions()">
        SHARE NOW
    </button>

    <div class="share-options" id="shareOptions">

        <a class="app-btn" id="whatsappBtn" href="#" target="_blank">
            WhatsApp
        </a>

        <a class="app-btn" id="xBtn" href="#" target="_blank">
            X (Twitter)
        </a>

        <a class="app-btn" id="discordBtn" href="#" target="_blank">
            Discord
        </a>

    </div>

</div>

<script>
const websiteLink = "https://YOUR_GITHUB_PAGES_LINK";

const message =
"Check out this promotional offer: " + websiteLink;

document.getElementById("whatsappBtn").href =
    "https://wa.me/?text=" + encodeURIComponent(message);

document.getElementById("xBtn").href =
    "https://twitter.com/intent/tweet?text=" + encodeURIComponent(message);

document.getElementById("discordBtn").href =
    "https://discord.com/channels/@me";

function showShareOptions(){
    document.getElementById("shareOptions").style.display = "block";
}
</script>

</body>
</html>
